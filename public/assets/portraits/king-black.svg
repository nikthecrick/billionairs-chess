<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5deb3"/>
      <stop offset="100%" style="stop-color:#deb887"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7355"/>
      <stop offset="100%" style="stop-color:#6b5335"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="#1a1a2e"/>
  <!-- Neck -->
  <rect x="80" y="150" width="40" height="30" fill="url(#skin)"/>
  <!-- Glasses frame top -->
  <rect x="55" y="82" width="90" height="3" rx="1" fill="#333"/>
  <!-- Head shape -->
  <ellipse cx="100" cy="105" rx="45" ry="52" fill="url(#skin)"/>
  <!-- Hair - parted, grayish -->
  <path d="M55 75 Q60 42 100 38 Q140 42 145 75 L142 82 Q138 52 100 48 Q62 52 58 82 Z" fill="url(#hair)"/>
  <!-- Glasses -->
  <rect x="60" y="88" width="30" height="22" rx="4" fill="none" stroke="#333" stroke-width="2.5"/>
  <rect x="110" y="88" width="30" height="22" rx="4" fill="none" stroke="#333" stroke-width="2.5"/>
  <line x1="90" y1="98" x2="110" y2="98" stroke="#333" stroke-width="2"/>
  <!-- Eyes behind glasses -->
  <ellipse cx="75" cy="100" rx="5" ry="4" fill="white"/>
  <circle cx="75" cy="100" r="3" fill="#3498db"/>
  <circle cx="74" cy="99" r="1" fill="white"/>
  <ellipse cx="125" cy="100" rx="5" ry="4" fill="white"/>
  <circle cx="125" cy="100" r="3" fill="#3498db"/>
  <circle cx="124" cy="99" r="1" fill="white"/>
  <!-- Eyebrows -->
  <path d="M60 84 Q75 80 88 84" stroke="#6b5335" stroke-width="2.5" fill="none"/>
  <path d="M112 84 Q125 80 140 84" stroke="#6b5335" stroke-width="2.5" fill="none"/>
  <!-- Nose -->
  <path d="M96 102 Q100 115 104 102" stroke="#c9a07a" stroke-width="1.5" fill="none"/>
  <!-- Smile -->
  <path d="M80 125 Q100 132 120 125" stroke="#8b4513" stroke-width="2" fill="none"/>
  <!-- Freckles -->
  <circle cx="68" cy="110" r="1" fill="#c9a07a" opacity="0.5"/>
  <circle cx="72" cy="112" r="1" fill="#c9a07a" opacity="0.5"/>
  <circle cx="128" cy="110" r="1" fill="#c9a07a" opacity="0.5"/>
  <circle cx="132" cy="112" r="1" fill="#c9a07a" opacity="0.5"/>
  <!-- Crown for KING -->
  <path d="M70 28 L80 15 L90 25 L100 8 L110 25 L120 15 L130 28 Z" fill="#ffd700" stroke="#ffaa00" stroke-width="1"/>
  <circle cx="80" cy="20" r="3" fill="#ff6b6b"/>
  <circle cx="100" cy="12" r="3" fill="#4ecdc4"/>
  <circle cx="120" cy="20" r="3" fill="#ff6b6b"/>
</svg>