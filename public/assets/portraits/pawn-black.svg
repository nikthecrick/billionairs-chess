<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5deb3"/>
      <stop offset="100%" style="stop-color:#deb887"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="#1a1a2e"/>
  <!-- Body base -->
  <rect x="65" y="145" width="70" height="50" rx="5" fill="#2c3e50"/>
  <!-- Neck -->
  <rect x="85" y="135" width="30" height="20" fill="url(#skin)"/>
  <!-- Head shape -->
  <ellipse cx="100" cy="95" rx="38" ry="45" fill="url(#skin)"/>
  <!-- Hair - short -->
  <path d="M62 78 Q65 48 100 44 Q135 48 138 78 L136 85 Q132 56 100 52 Q68 56 64 85 Z" fill="url(#hair)"/>
  <!-- Eyes -->
  <ellipse cx="84" cy="90" rx="8" ry="6" fill="white"/>
  <ellipse cx="84" cy="91" rx="4" ry="3.5" fill="#2c3e50"/>
  <circle cx="83" cy="89" r="1.5" fill="white"/>
  <ellipse cx="116" cy="90" rx="8" ry="6" fill="white"/>
  <ellipse cx="116" cy="91" rx="4" ry="3.5" fill="#2c3e50"/>
  <circle cx="115" cy="89" r="1.5" fill="white"/>
  <!-- Eyebrows -->
  <path d="M72 80 Q84 76 94 80" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M106 80 Q116 76 128 80" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <!-- Nose -->
  <path d="M96 94 Q100 105 104 94" stroke="#c9a07a" stroke-width="1.5" fill="none"/>
  <!-- Mouth -->
  <path d="M80 112 Q100 122 120 112" stroke="#8b4513" stroke-width="2" fill="none"/>
  <!-- Circle for PAWN -->
  <circle cx="100" cy="30" r="18" fill="#2c3e50" stroke="#1a2530" stroke-width="2"/>
  <circle cx="100" cy="30" r="10" fill="#1a2530"/>
</svg>