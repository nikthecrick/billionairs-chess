  <path d="M82 126 Q100 135 118 126" stroke="#8b4513" stroke-width="2.5" fill="none"/>
  <!-- Beard stubble -->
  <path d="M75 135 Q100 148 125 135" fill="#1a1a1a" opacity="0.15"/>
  <!-- Tiara for QUEEN -->
  <path d="M65 35 L75 15 L85 30 L100 5 L115 30 L125 15 L135 35 Z" fill="#e91e63" stroke="#c2185b" stroke-width="1"/>
  <circle cx="75" cy="22" r="3" fill="#ffd700"/>
