  <path d="M65 83 Q80 78 90 83" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
  <path d="M110 83 Q120 78 135 83" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
  <!-- Nose -->
  <path d="M95 100 Q100 116 105 100" stroke="#c9956a" stroke-width="2" fill="none"/>
